# Runs the same Taskfile commands used locally, so a green run here means
# `nix run --inputs-from . nixpkgs#go-task -- <task>` passes on your machine too.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The weekly update (update.yml) runs this same CI on its branch before merging.
  workflow_call:
    inputs:
      ref:
        description: Branch to check out. Empty means the commit that triggered the run.
        type: string
        default: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
          gc-max-store-size-linux: 6G
      - name: lint
        run: nix run --inputs-from . nixpkgs#go-task -- lint

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
          gc-max-store-size-linux: 6G
      - name: check
        run: nix run --inputs-from . nixpkgs#go-task -- check

  test-i3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
          gc-max-store-size-linux: 6G
      - name: test-i3
        run: nix run --inputs-from . nixpkgs#go-task -- test-i3

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - build-kevinfrench-MSS01-T4
          - build-kdfrench-MSS01-WKS62.motivss.local
          - build-kdfrench-hagrid
          - build-kdfrench-hedwig
    steps:
      # NixOS closures (nvidia, GNOME) are larger than a stock runner's free disk.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
          gc-max-store-size-linux: 6G
      - name: build
        run: nix run --inputs-from . nixpkgs#go-task -- ${{ matrix.target }}
