# Runs the same Taskfile commands used locally, so a green run here means
# `nix run --inputs-from . nixpkgs#go-task -- <task>` passes on your machine too.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The weekly update (update.yml) runs this same CI on its branch before merging.
  workflow_call:
    inputs:
      ref:
        description: Branch to check out. Empty means the commit that triggered the run.
        type: string
        default: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: lint
        run: nix run --inputs-from . nixpkgs#go-task -- lint

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: check
        run: nix run --inputs-from . nixpkgs#go-task -- check

  test-i3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: test-i3
        run: nix run --inputs-from . nixpkgs#go-task -- test-i3

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - build-kevinfrench-MSS01-T4
          - build-kdfrench-MSS01-WKS62.motivss.local
          - build-kdfrench-hagrid
          - build-kdfrench-hedwig
    steps:
      # NixOS closures (nvidia, GNOME) are larger than a stock runner's free disk.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: build
        run: nix run --inputs-from . nixpkgs#go-task -- ${{ matrix.target }}
