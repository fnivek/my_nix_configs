version: '3'

tasks:
  watch:
    desc: Run all checks whenever a change occurs.
    summary: |
      Watches flake.nix and src/**/*.nix. On every change it clears the screen, then runs
      `task lint` and `task build-all`.

      Usage:
        task watch    # leave it running beside the editor
    cmds:
      - clear
      - task: lint
      - task: build-all
    sources:
      - "flake.nix"
      - "src/**/*.nix"
    watch: true
    interval: 1s

  # Build and change to the current configuration.
  # This task uses the systems current username and hostname to determine if it is a
  # home manager or nixos.
  switch:
    desc: Rebuild and switch your configurations.
    summary: |
      Builds this machine's configuration and activates it. Picks home-manager or NixOS from
      `whoami` and `hostname` (the switch-<user>-<host> tasks). NixOS hosts run
      `sudo nixos-rebuild switch`.

      Usage:
        task switch
    vars:
      HOST:
        sh: hostname
      USER:
        sh: whoami
    cmds:
      - task: switch-{{.USER}}-{{.HOST}}

  # Hidden tasks to dispatch the specific user system combo to switch-hm or switch-nixos.
  switch-kevinfrench-MSS01-T4: {cmds: [task: switch-hm]}
  switch-kdfrench-MSS01-WKS62.motivss.local: {cmds: [task: switch-hm]}
  switch-kdfrench-hagrid: {cmds: [task: switch-nixos]}
  switch-kdfrench-hedwig: {cmds: [task: switch-nixos]}

  # Build and change the home manager configuration.
  switch-hm:
    vars:
      # It only makes sense to run this command for the current running system so
      # the vars get the current system information.
      HOST:
        sh: hostname
      USER:
        sh: whoami
    cmds:
      - home-manager switch --flake .#{{.USER}}@{{.HOST}}

  # Build and change the nixos configuration.
  switch-nixos:
    cmds:
      - sudo nixos-rebuild switch

  # Build but don't change your configuration.
  # This task uses the systems current username and hostname to determine if it is a
  # home manager or nixos.
  build:
    desc: Build the your host configuration but don't activate or add to boot.
    summary: |
      Builds this machine's configuration without activating it or adding a boot entry. Picks
      the target from `whoami` and `hostname`.

      Usage:
        task build
        task build-kdfrench-hagrid    # one specific host, from any machine
    vars:
      HOST:
        sh: hostname
      USER:
        sh: whoami
    cmds:
      - task: build-{{.USER}}-{{.HOST}}

  # Hidden tasks to dispatch the specific user system combo to build-hm or build-nixos.
  build-kevinfrench-MSS01-T4: {cmds: [{task: build-hm, vars: {HOST: MSS01-T4, USER: kevinfrench}}]}
  build-kdfrench-MSS01-WKS62.motivss.local: {cmds: [{task: build-hm, vars: {HOST: MSS01-WKS62.motivss.local, USER: kdfrench}}]}
  build-kdfrench-hagrid: {cmds: [{task: build-nixos, vars: {HOST: hagrid}}]}
  build-kdfrench-hedwig: {cmds: [{task: build-nixos, vars: {HOST: hedwig}}]}

  # Build for every system user combo.
  build-all:
    desc: Build all configurations.
    summary: |
      Builds all four configurations (two home-manager, two NixOS), as CI does. The NixOS
      closures need several GB of disk.

      Usage:
        task build-all
    cmds:
      - task: build-kevinfrench-MSS01-T4
      - task: build-kdfrench-MSS01-WKS62.motivss.local
      - task: build-kdfrench-hagrid
      - task: build-kdfrench-hedwig

  # Builds a nixos configuration.
  # var HOST - required, the host to build.
  build-nixos:
    cmds:
      # Using nix build instead of nixos-rebuild command enables us to build in ci and on
      # non-nixos systems.
      - nix build .#nixosConfigurations.{{.HOST}}.config.system.build.toplevel

  # Builds a hm configuration.
  # var HOST - required, the host to build.
  # var USER - required, the user to build.
  build-hm:
    cmds:
      - nix run --inputs-from . home-manager -- build --flake .#{{.USER}}@{{.HOST}}

  check:
    desc: Evaluate every host and build every package and dev shell (nix flake check).
    summary: |
      Runs `nix flake check`: evaluates every host, and builds every package, every dev shell
      and every other entry in the flake's `checks` output. Package builds run their unit tests.
      CI runs it on every PR.

      Usage:
        task check
        nix build .#checks.x86_64-linux.<name>    # one check
    cmds:
      - nix flake check

  test-i3:
    desc: Run the i3 scripts' regression tests (src/pkgs/i3-scripts/tests) in a virtual X display.
    summary: |
      Builds the i3-scripts package, then runs each tests/*.sh against a real i3 in a virtual X
      display (Xvfb). Each test reproduces a fixed bug. The unit tests (tests/test_*.py) run in the
      package build instead, see `task check`.

      Usage:
        task test-i3
        # one test against an already built package:
        pkg=$(nix build --no-link --print-out-paths .#i3-scripts)
        nix shell --inputs-from . nixpkgs#i3 nixpkgs#xvfb-run nixpkgs#xterm \
          -c xvfb-run -a src/pkgs/i3-scripts/tests/focus.sh "$pkg"
    vars:
      PACKAGE:
        sh: nix build --no-link --print-out-paths .#i3-scripts
      TESTS:
        sh: ls src/pkgs/i3-scripts/tests/*.sh | grep -v /lib.sh
    cmds:
      - for: {var: TESTS}
        cmd: >-
          nix shell --inputs-from . nixpkgs#i3 nixpkgs#xvfb-run nixpkgs#xterm
          -c xvfb-run -a {{ .ITEM }} {{ .PACKAGE }}

  update:
    desc: Updates all flake inputs.
    summary: |
      Updates every flake input to its latest revision and rewrites flake.lock. Check the
      result with `git diff flake.lock` and `task build-all`. CI does this every Monday and
      merges into main when every check passes (.github/workflows/update.yml).

      Usage:
        task update
        nix flake update nixpkgs    # one input only
    cmds:
      - nix flake update

  garbage-collect:
    desc: Removes unused nix/store paths.
    summary: |
      Deletes store paths that no profile or GC root uses (`nix-collect-garbage`). Old
      generations are kept, see delete-generations-older-than-*.

      Usage:
        task garbage-collect
    cmds:
      - nix-collect-garbage

  list-generations:
    desc: List nix-os generations.
    summary: |
      Lists the NixOS system generations with their dates. NixOS only, needs sudo.

      Usage:
        task list-generations
    cmds:
      - sudo nix-env --list-generations --profile /nix/var/nix/profiles/system

  delete-generations-older-than-*:
    desc: Delete nix-os generations older than argument.
    summary: |
      Deletes NixOS system generations older than the age in the task name, in any form nix-env
      accepts (30d, 14d). Run `task garbage-collect` afterwards to free the space. Needs sudo.

      Usage:
        task delete-generations-older-than-30d
    vars:
      BEFORE: "{{index .MATCH 0}}"
    cmds:
      - sudo nix-env --delete-generations --profile /nix/var/nix/profiles/system {{.BEFORE}}

  make-boot-space:
    desc: Removes old generations garbage collects and switches to clear out boot.
    summary: |
      Frees /boot when it is full: deletes generations older than 30 days, garbage-collects,
      then switches so the bootloader drops the old entries.

      Usage:
        task make-boot-space
    cmds:
      - task: delete-generations-older-than-30d
      - task: garbage-collect
      - task: switch

  format:
    desc: Format all nix and Python files.
    summary: |
      Formats every Nix file with nixfmt and every Python file under src/ with ruff, in place,
      at 100 columns.

      Usage:
        task format
    cmds:
      - for: sources
        cmd: nix run --inputs-from . nixpkgs#nixfmt -- {{ .ITEM }}
      - nix run --inputs-from . nixpkgs#ruff -- format src
    sources:
      - "flake.nix"
      - "src/**/*.nix"

  lint:
    desc: Check if all files meet standards.
    summary: |
      Runs every style check CI runs: nixfmt-check, static-analysis (statix), shell-lint
      (shellcheck), workflow-lint (actionlint) and python-lint (ruff). Skipped when no source
      changed since the last pass, unless forced.

      Usage:
        task lint
        task --force lint
    cmds:
      - task: nixfmt-check
      - task: static-analysis
      - task: shell-lint
      - task: workflow-lint
      - task: python-lint
    sources:
      - "flake.nix"
      - "src/**/*.nix"
      - "src/**/*.sh"
      - "src/**/*.py"
      - ".github/workflows/*.yml"

  shell-lint:
    desc: Check every shell script in the repo with shellcheck.
    summary: |
      Runs shellcheck on every *.sh file tracked by git, following sourced files (-x).

      Usage:
        task shell-lint
    cmds:
      - nix run --inputs-from . nixpkgs#shellcheck -- -x $(git ls-files '*.sh')

  workflow-lint:
    desc: Check the GitHub workflows with actionlint, and that every action is pinned by commit.
    summary: |
      Runs actionlint on .github/workflows/*.yml (workflow syntax, expressions, job and step
      references, runner labels), then fails if any action is pinned by a tag instead of a commit
      hash. A tag can move to different code, a commit hash cannot. Dependabot keeps the pins
      current.

      Usage:
        task workflow-lint
    cmds:
      - nix run --inputs-from . nixpkgs#actionlint -- .github/workflows/*.yml
      # A tag can move to different code, a commit hash cannot.
      - cmd: |
          unpinned=$(grep -nE 'uses: [^.][^@]*@[^0-9a-f ]' .github/workflows/*.yml || true)
          if [ -n "$unpinned" ]; then
            echo "$unpinned"
            echo "pin these actions by commit hash (uses: owner/action@<sha> # vX.Y.Z)"
            exit 1
          fi

  nixfmt-check:
    desc: Check if all files are formatted correctly.
    summary: |
      Checks that every Nix file is formatted by nixfmt (100 columns) without changing it.
      `task format` fixes what it reports.

      Usage:
        task nixfmt-check
    cmds:
      - for: sources
        cmd: nix run --inputs-from . nixpkgs#nixfmt -- -c {{ .ITEM }}
    sources:
      - "flake.nix"
      - "src/**/*.nix"

  static-analysis:
    desc: Check if all files meet statix analysis.
    summary: |
      Runs statix on every Nix file to flag anti-patterns and suggest simpler forms.

      Usage:
        task static-analysis
    cmds:
      - for: sources
        cmd: nix run --inputs-from . nixpkgs#statix check {{ .ITEM }}
    sources:
      - "flake.nix"
      - "src/**/*.nix"

  python-lint:
    desc: Check Python files with ruff's default rules and formatter.
    summary: |
      Runs ruff's lint rules and its format check on src/, with ruff.toml's settings (100
      columns). `task format` fixes formatting.

      Usage:
        task python-lint
        nix run --inputs-from . nixpkgs#ruff -- check --fix src    # apply the safe fixes
    cmds:
      - nix run --inputs-from . nixpkgs#ruff -- check src
      - nix run --inputs-from . nixpkgs#ruff -- format --check src

  dev-zshell:
    desc: Drop into a zsh with all dev dependencies.
    summary: |
      Opens zsh inside the devbox environment from devbox.json. Needs devbox installed.

      Usage:
        task dev-zshell
    cmds:
      - devbox run zsh
    interactive: true

  hm-news:
    desc: Read home managers news items.
    summary: |
      Shows home-manager's news for this machine's configuration (user and host from `whoami`
      and `hostname`).

      Usage:
        task hm-news
    vars:
      HOST:
        sh: hostname
      USER:
        sh: whoami
    cmds:
      - nix run --inputs-from . home-manager -- news --flake .#{{.USER}}@{{.HOST}}
